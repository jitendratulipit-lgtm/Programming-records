name: OSPF & BGP Automation

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:   # allows manual trigger

jobs:
  run-network-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OSPF script
        run: python ospf_config.py

      - name: Run BGP script
        run: python bgp_config.py

      - name: Archive logs
        uses: actions/upload-artifact@v3
        with:
          name: bgp-ospf-logs
          path: BGP_Logs/
